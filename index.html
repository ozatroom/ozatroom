<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <meta name="description" content="OZATROOM AI FILM STUDIO — cinematic pre-production workspace" />
    <title>OZATROOM AI FILM STUDIO</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#101114;color:#f1eee8}
      body{font-family:Arial,sans-serif}
      .boot-screen{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#25231f 0%,#101114 62%)}
      .boot-card{text-align:center;padding:30px}
      .boot-mark{width:58px;height:58px;border:1px solid #9d8059;border-radius:15px;display:grid;place-items:center;margin:0 auto 18px;color:#d6b88d;font:30px Georgia,serif}
      .boot-title{font-size:14px;letter-spacing:3px}
      .boot-sub{font-size:10px;letter-spacing:2px;color:#8c8982;margin-top:8px}
      .boot-error{max-width:520px;margin:18px auto 0;color:#d99b8e;font-size:12px;line-height:1.6}
    </style>
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && root.querySelector('.boot-screen')) {
          var error = document.createElement('p');
          error.className = 'boot-error';
          error.textContent = 'Не удалось запустить приложение: ' + (event.message || 'ошибка загрузки файла');
          root.querySelector('.boot-card').appendChild(error);
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var root = document.getElementById('root');
        if (root && root.querySelector('.boot-screen')) {
          var error = document.createElement('p');
          error.className = 'boot-error';
          error.textContent = 'Ошибка запуска: ' + String(event.reason || 'неизвестная ошибка');
          root.querySelector('.boot-card').appendChild(error);
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen"><div class="boot-card"><div class="boot-mark">O.</div><div class="boot-title">OZATROOM</div><div class="boot-sub">AI FILM STUDIO · ЗАГРУЗКА</div></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
